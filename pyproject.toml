[project]
name = "researcher"
version = "0.1.0"
description = "Collect, cluster, and publish evidence-backed product problems"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2", "celery[redis]>=5.4,<6", "feedparser>=6,<7",
  "httpx>=0.27,<1", "pgvector>=0.4,<1", "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.5,<3", "sqlalchemy>=2.0,<3", "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1", "aiogram>=3.13,<4", "aiohttp-socks>=0.12,<1",
  "beautifulsoup4>=4.12,<5"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "respx>=0.21,<1", "ruff>=0.7,<1"]
[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py312"
