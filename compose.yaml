services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: researcher
      POSTGRES_USER: researcher
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: ["db_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researcher -d researcher"]
      interval: 5s
      retries: 15
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    restart: unless-stopped
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
    restart: "no"
  api:
    build: .
    env_file: .env
    command: ["uvicorn", "researcher.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_started}
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    command: ["celery", "-A", "researcher.tasks:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_started}
    restart: unless-stopped
  beat:
    build: .
    env_file: .env
    command: ["celery", "-A", "researcher.tasks:celery_app", "beat", "--loglevel=INFO"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_started}
    restart: unless-stopped
  bot:
    build: .
    env_file: .env
    command: ["python", "-m", "researcher.bot"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
volumes:
  db_data:
  redis_data:

