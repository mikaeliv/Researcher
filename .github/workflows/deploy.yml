name: Deploy Researcher

on:
  push:
    branches:
      - main

concurrency:
  group: researcher-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/researcher_deploy
          chmod 600 ~/.ssh/researcher_deploy

          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          ssh \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/researcher_deploy \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'cd /opt/researcher &&
             git pull --ff-only &&
             docker compose up -d --build &&
             docker compose ps'